name: UWP Builder

on:
  workflow_dispatch:

jobs:
  build-uwp:
    runs-on: windows-2019

    steps:
    - name: Checkout specific tag (mame0235)
      uses: actions/checkout@v4
      with:
        ref: mame0235  # Ensure this is a valid tag

    - name: Setup MSYS2 with MINGW64
      uses: msys2/setup-msys2@v2
      with:
        install: git make mingw-w64-x86_64-gcc mingw-w64-x86_64-python mingw-w64-x86_64-lld mingw-w64-x86_64-libc++
        msystem: MINGW64  # Use MinGW 64-bit environment
        update: true  # Optional: Update packages first

    - name: Find and set up MSBuild
      shell: pwsh
      id: msbuild
      run: |
        # Use vswhere to locate Visual Studio installation
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
        if ($vsPath) {
          # Locate msbuild.exe
          $msbuildPath = Join-Path $vsPath "MSBuild\Current\Bin\MSBuild.exe"
          if (Test-Path $msbuildPath) {
            echo "MSBuild path: $msbuildPath"
            echo "::set-output name=msbuild_path::$msbuildPath"
          } else {
            Write-Error "MSBuild.exe not found at $msbuildPath!"
            exit 1
          }
        } else {
          Write-Error "Visual Studio with MSBuild not found!"
          exit 1
        }

    - name: Build with MINGW64 and MSBUILD
      shell: msys2 {0}  # Use MSYS2 shell for this step
      env:
        MSYSTEM: MINGW64  # Force MinGW 64-bit environment
        ARCHOPTS: "-fuse-ld=lld"
        OVERRIDE_AR: "llvm-ar"
        TOOLS: 1
        MSBUILD_PATH: ${{ steps.msbuild.outputs.msbuild_path }}  # Pass the full path to msbuild.exe
      run: |
        echo "Using MSBuild at: $MSBUILD_PATH"
        make vs2019_uwp MSBUILD=1 MSBUILD_PATH="$MSBUILD_PATH"

    - name: 7zip all files
      shell: pwsh  # Use PowerShell for native Windows tools
      run: |
        7z a artifacts/all-files.7z *
        # If 7z isn't in PATH, use full path:
        # & "C:\Program Files\7-Zip\7z.exe" a artifacts/all-files.7z *

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: all-files
        path: artifacts/all-files.7z
